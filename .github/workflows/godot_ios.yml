name: Build Godot 4 iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-godot-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Godot 4 & Export Templates
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_macos.universal.zip
          unzip Godot_v4.3-stable_macos.universal.zip
          sudo mv Godot.app /Applications/Godot.app
          
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/4.3.stable/
          wget https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip Godot_v4.3-stable_export_templates.tpz -d ~/Library/Application\ Support/Godot/export_templates/4.3.stable/
          mv ~/Library/Application\ Support/Godot/export_templates/4.3.stable/templates/* ~/Library/Application\ Support/Godot/export_templates/4.3.stable/

      # إنشاء ملف export_presets.cfg تلقائياً لضمان وجود الإعداد الصحيح
      - name: Generate Preset File
        run: |
          cat << 'EOF' > export_presets.cfg
          [preset.0]

          name="iOS"
          platform="iOS"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/ios/TowerWars.xcodeproj"

          [preset.0.options]

          architectural/arm64=true
          application/app_store_team_id="1234567890"
          application/bundle_identifier="com.towerwars.game"
          application/signature="????"
          application/short_version="1.0"
          application/version="1.0"
          capabilities/access_wifi=false
          capabilities/push_notifications=false
          user_data/custom_directory_name=""
          EOF

      # تصدير مشروع Xcode من Godot
      - name: Export Godot Project to Xcode
        run: |
          mkdir -p build/ios
          /Applications/Godot.app/Contents/MacOS/Godot --headless --export-release "iOS" build/ios/TowerWars.xcodeproj project.godot

      # بناء مشروع Xcode وتوليد تطبيق iOS بدون توقيع
      - name: Build Xcode Project (No CodeSign)
        run: |
          cd build/ios
          xcodebuild -project TowerWars.xcodeproj -scheme TowerWars -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO build

      # حزم الملف في صيغة IPA
      - name: Package IPA
        run: |
          cd build/ios/build/Release-iphoneos
          mkdir -p Payload
          mv TowerWars.app Payload/ 2>/dev/null || mv *.app Payload/
          zip -r TowerWars_Godot.ipa Payload

      # رفع الملف الناتج
      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TowerWars-Godot-IPA
          path: build/ios/build/Release-iphoneos/TowerWars_Godot.ipa
          if-no-files-found: error
