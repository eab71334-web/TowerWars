name: Build Godot iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          echo "Preparing to build TowerWars for iOS..."
          # إنشاء مجلد وهمي لملف اللعبة للتجربة
          mkdir -p build/ios
          echo "TowerWars Game Data" > build/ios/game.txt

      - name: Upload Game Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TowerWars-IPA-Build
          path: build/ios/
