name: Build Godot 4 iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-godot-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Godot 4 & Export Templates
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_macos.universal.zip
          unzip -q Godot_v4.3-stable_macos.universal.zip
          sudo mv Godot.app /Applications/Godot.app
          
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/4.3.stable/
          wget https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz -d ~/Library/Application\ Support/Godot/export_templates/4.3.stable/
          mv ~/Library/Application\ Support/Godot/export_templates/4.3.stable/templates/* ~/Library/Application\ Support/Godot/export_templates/4.3.stable/

      # 1. إنشاء ملف إعدادات التصدير
      - name: Create export_presets.cfg
        run: |
          cat << 'EOF' > export_presets.cfg
          [preset.0]

          name="iOS"
          platform="iOS"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/game.pck"

          [preset.0.options]

          architectural/arm64=true
          application/app_store_team_id="1234567890"
          application/bundle_identifier="com.towerwars.game"
          application/signature="????"
          application/short_version="1.0"
          application/version="1.0"
          EOF

      # 2. تصدير ملف بيانات اللعبة pck
      - name: Export Godot PCK
        run: |
          mkdir -p build
          /Applications/Godot.app/Contents/MacOS/Godot --headless --export-pack "iOS" build/game.pck project.godot

      # 3. إعداد مشروع Xcode وتجميعه بالكامل بواسطة xcodebuild
      - name: Compile iOS Binary
        run: |
          TEMPLATE_ZIP="$HOME/Library/Application Support/Godot/export_templates/4.3.stable/ios.zip"
          unzip -q "$TEMPLATE_ZIP" -d build/xcode_proj
          
          cd build/xcode_proj
          # تجميع مشروع Xcode القادم من القوالب لـ arm64
          xcodebuild build \
            -project *.xcodeproj \
            -scheme Godot \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR=../build_output || xcodebuild build -scheme Godot -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CONFIGURATION_BUILD_DIR=../build_output

      # 4. تجميع حزمة IPA وتجهيز الملف التنفيذي
      - name: Create IPA Structure
        run: |
          mkdir -p build/Payload/TowerWars.app
          
          # نسخ مخرجات البناء والملفات التنفيذية
          cp -R build/build_output/*.app/* build/Payload/TowerWars.app/ 2>/dev/null || cp -R build/build_output/* build/Payload/TowerWars.app/ 2>/dev/null || true
          
          # إدراج ملف بيانات اللعبة pck
          cp build/game.pck build/Payload/TowerWars.app/
          
          # التأكد من وجود ملف Info.plist وتحديث معرّف التطبيق
          cat << 'EOF' > build/Payload/TowerWars.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.plist">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>godot_ios</string>
              <key>CFBundleIdentifier</key>
              <string>com.towerwars.game</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>TowerWars</string>
              <key>CFBundleDisplayName</key>
              <string>Tower Wars</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>13.0</string>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>UIRequiresFullScreen</key>
              <true/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
          </dict>
          </plist>
          EOF

      # 5. الضغط إلى ملف IPA
      - name: Package Final IPA
        run: |
          cd build
          zip -r TowerWars_Godot.ipa Payload

      # 6. رفع ملف الـ IPA الناتج
      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TowerWars-Godot-IPA
          path: build/TowerWars_Godot.ipa
          if-no-files-found: error
