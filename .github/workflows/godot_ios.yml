name: Build Godot 4 iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-godot-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Godot Engine
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.2.2
          use-dotnet: false

      - name: Download and Install Godot Export Templates
        run: |
          GODOT_VERSION="4.2.2.stable"
          TEMPLATES_DIR="$HOME/Library/Application Support/Godot/export_templates/$GODOT_VERSION"
          mkdir -p "$TEMPLATES_DIR"
          
          echo "Downloading export templates..."
          curl -L -o templates.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          
          unzip -q templates.zip -d /tmp/templates
          mv /tmp/templates/templates/* "$TEMPLATES_DIR/"
          rm -rf templates.zip /tmp/templates
          
          echo "Templates successfully installed in: $TEMPLATES_DIR"

      - name: Create export_presets.cfg if missing
        run: |
          if [ ! -f export_presets.cfg ]; then
            cat << 'EOF' > export_presets.cfg
          [preset.0]
          name="iOS"
          platform="iOS"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/ios/game.xcodeproj"
          script_export_mode=1

          [preset.0.options]
          architectures/arm64=true
          EOF
          fi

      - name: Export Godot iOS Project
        run: |
          mkdir -p build/ios
          godot --headless --export-release "iOS" build/ios/game.xcodeproj

      - name: Build Xcode Project (No Codesign)
        run: |
          cd build/ios
          XCODE_PROJ=$(ls -d *.xcodeproj | head -n 1)
          SCHEME_NAME=$(basename "$XCODE_PROJ" .xcodeproj)
          xcodebuild -project "$XCODE_PROJ" \
            -scheme "$SCHEME_NAME" \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA / TIPA Structure
        run: |
          cd build/ios
          mkdir -p Payload
          cp -r build/Release-iphoneos/*.app Payload/ 2>/dev/null || cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r TowerWars_Godot_iOS.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TowerWars-Godot-IPA
          path: build/ios/TowerWars_Godot_iOS.ipa
