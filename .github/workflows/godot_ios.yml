name: Build Godot 4 iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-godot-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Godot 4 & Export Templates
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_macos.universal.zip
          unzip -q Godot_v4.3-stable_macos.universal.zip
          sudo mv Godot.app /Applications/Godot.app
          
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/4.3.stable/
          wget https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz -d ~/Library/Application\ Support/Godot/export_templates/4.3.stable/
          mv ~/Library/Application\ Support/Godot/export_templates/4.3.stable/templates/* ~/Library/Application\ Support/Godot/export_templates/4.3.stable/

      # 1. إعداد ملف التصدير
      - name: Create export_presets.cfg
        run: |
          printf '[preset.0]\n\nname="iOS"\nplatform="iOS"\nrunnable=true\ndedicated_server=false\ncustom_features=""\nexport_filter="all_resources"\ninclude_filter=""\nexclude_filter=""\nexport_path="build/game.pck"\n\n[preset.0.options]\n\narchitectural/arm64=true\napplication/app_store_team_id="1234567890"\napplication/bundle_identifier="com.towerwars.game"\napplication/signature="????"\napplication/short_version="1.0"\napplication/version="1.0"\ncapabilities/access_wifi=false\ncapabilities/push_notifications=false\nuser_data/custom_directory_name=""\n' > export_presets.cfg

      # 2. تصدير ملف اللعبة PCK
      - name: Export Godot PCK
        run: |
          mkdir -p build
          /Applications/Godot.app/Contents/MacOS/Godot --headless --export-pack "iOS" build/game.pck project.godot

      # 3. بناء وتجهيز هيكل التطبيق IPA
      - name: Build Application Structure
        run: |
          mkdir -p build/Payload/TowerWars.app
          TEMPLATE_ZIP="$HOME/Library/Application Support/Godot/export_templates/4.3.stable/ios.zip"
          unzip -q "$TEMPLATE_ZIP" -d build/godot_template
          
          # البحث عن الملف التنفيذي الخاص بـ iOS داخل القالب
          EXECUTABLE=$(find build/godot_template -type f -name "godot_ios.release.arm64" -o -name "godot_ios.debug.arm64" | head -n 1)
          if [ -z "$EXECUTABLE" ]; then
            EXECUTABLE=$(find build/godot_template -type f -exec file {} + | grep "Mach-O 64-bit" | cut -d: -f1 | head -n 1)
          fi

          if [ -n "$EXECUTABLE" ]; then
            cp "$EXECUTABLE" build/Payload/TowerWars.app/TowerWars
            chmod +x build/Payload/TowerWars.app/TowerWars
          else
            echo "Error: Binary not found!"
            exit 1
          fi
          
          # نسخ ملف اللعبة
          cp build/game.pck build/Payload/TowerWars.app/

          # إنشاء ملف Info.plist قياسي ومعتمد
          cat << 'EOF' > build/Payload/TowerWars.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.plist">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>TowerWars</string>
              <key>CFBundleIdentifier</key>
              <string>com.towerwars.game</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>TowerWars</string>
              <key>CFBundleDisplayName</key>
              <string>Tower Wars</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>13.0</string>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>UIRequiresFullScreen</key>
              <true/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
          </dict>
          </plist>
          EOF

      # 4. تجميع ملف IPA
      - name: Package Final IPA
        run: |
          cd build
          zip -r TowerWars_Godot.ipa Payload

      # 5. رفع الملف الناتج
      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TowerWars-Godot-IPA
          path: build/TowerWars_Godot.ipa
          if-no-files-found: error
