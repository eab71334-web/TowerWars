name: Build Godot 4 iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-godot-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Godot Engine
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.2.2
          use-dotnet: false

      - name: Export Godot iOS Project
        run: |
          mkdir -p build/ios
          godot --headless --export-release "iOS" build/ios/TowerWars.xcodeproj || true

      - name: Build Xcode Project (No Codesign)
        run: |
          cd build/ios
          xcodebuild -project TowerWars.xcodeproj \
            -scheme TowerWars \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA / TIPA Structure
        run: |
          cd build/ios
          mkdir -p Payload
          cp -r build/Release-iphoneos/TowerWars.app Payload/
          zip -r TowerWars_Godot_iOS.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TowerWars-Godot-IPA
          path: build/ios/TowerWars_Godot_iOS.ipa
