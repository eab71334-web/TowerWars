name: Build Godot 4 iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-godot-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Godot 4 & Export Templates
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_macos.universal.zip
          unzip Godot_v4.3-stable_macos.universal.zip
          sudo mv Godot.app /Applications/Godot.app
          
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/4.3.stable/
          wget https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip Godot_v4.3-stable_export_templates.tpz -d ~/Library/Application\ Support/Godot/export_templates/4.3.stable/
          mv ~/Library/Application\ Support/Godot/export_templates/4.3.stable/templates/* ~/Library/Application\ Support/Godot/export_templates/4.3.stable/

      # إنشاء ملف إعدادات التصدير بصيغة صحيحة ودقيقة
      - name: Create export_presets.cfg
        run: |
          printf '[preset.0]\n\nname="iOS"\nplatform="iOS"\nrunnable=true\ndedicated_server=false\ncustom_features=""\nexport_filter="all_resources"\ninclude_filter=""\nexclude_filter=""\nexport_path="build/ios/game.pck"\n\n[preset.0.options]\n\narchitectural/arm64=true\napplication/app_store_team_id="1234567890"\napplication/bundle_identifier="com.towerwars.game"\napplication/signature="????"\napplication/short_version="1.0"\napplication/version="1.0"\ncapabilities/access_wifi=false\ncapabilities/push_notifications=false\nuser_data/custom_directory_name=""\n' > export_presets.cfg

      # تصدير حزمة ملفات اللعبة PCK لتجنب أخطاء الإعدادات
      - name: Export Godot Game Pack
        run: |
          mkdir -p build/ios
          /Applications/Godot.app/Contents/MacOS/Godot --headless --export-pack "iOS" build/ios/game.pck project.godot

      # حزم اللعبة داخل تطبيق iOS مستقل وتجميع الـ IPA
      - name: Package Unsigned iOS IPA
        run: |
          cd build/ios
          mkdir -p Payload/TowerWars.app
          mv game.pck Payload/TowerWars.app/
          
          # إنشاء ملف Info.plist أساسي للتطبيق
          cat << 'EOF' > Payload/TowerWars.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>TowerWars</string>
              <key>CFBundleIdentifier</key>
              <string>com.towerwars.game</string>
              <key>CFBundleName</key>
              <string>Tower Wars</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
          </dict>
          </plist>
          EOF

          zip -r TowerWars_Godot.ipa Payload

      # رفع ملف الـ IPA النهائي
      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TowerWars-Godot-IPA
          path: build/ios/TowerWars_Godot.ipa
          if-no-files-found: error
