name: Build Godot & Flutter iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. إعداد بيئة Flutter
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      # 2. تنزيل وتثبيت Godot 4.3 وقوالب التصدير
      - name: Download Godot Engine & Export Templates
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_macos.universal.zip
          unzip Godot_v4.3-stable_macos.universal.zip
          mv Godot.app /Applications/Godot.app
          
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/4.3.stable/
          wget https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip Godot_v4.3-stable_export_templates.tpz -d ~/Library/Application\ Support/Godot/export_templates/4.3.stable/
          mv ~/Library/Application\ Support/Godot/export_templates/4.3.stable/templates/* ~/Library/Application\ Support/Godot/export_templates/4.3.stable/

      # 3. تصدير مشروع Xcode من Godot
      - name: Export Xcode Project from Godot
        run: |
          mkdir -p build/ios
          /Applications/Godot.app/Contents/MacOS/Godot --headless --export-release "iOS" build/ios/TowerWars.xcodeproj

      # 4. بناء حزمة Flutter / Xcode بدون توقيع (CODE_SIGNING_ALLOWED=NO)
      - name: Build Unsigned iOS App
        run: |
          cd build/ios
          xcodebuild -project TowerWars.xcodeproj \
            -scheme TowerWars \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      # 5. ضغط المخرجات إلى ملف IPA غير موقع (جاهز للـ TIPA / TrollStore / AltStore)
      - name: Package Unsigned IPA
        run: |
          cd build/ios
          mkdir -p Payload
          cp -r build/Release-iphoneos/TowerWars.app Payload/
          zip -r TowerWars_Unsigned.ipa Payload

      # 6. رفع الملف كـ Artifact لتنزيله مباشرة من GitHub
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TowerWars-iOS-Unsigned-IPA
          path: build/ios/TowerWars_Unsigned.ipa
