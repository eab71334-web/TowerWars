name: Build Godot 4 iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-godot-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Godot Engine
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.2.2
          use-dotnet: false

      - name: Download & Install Export Templates via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GODOT_VERSION="4.2.2.stable"
          TARGET_DIR="$HOME/Library/Application Support/Godot/export_templates/$GODOT_VERSION"
          mkdir -p "$TARGET_DIR"

          echo "Downloading Godot export templates via GitHub CLI..."
          gh release download 4.2.2-stable \
            --repo godotengine/godot \
            --pattern "Godot_v4.2.2-stable_export_templates.tpz" \
            --output templates.tpz

          echo "Extracting templates..."
          unzip -q templates.tpz -d /tmp/godot_templates_extracted
          cp -r /tmp/godot_templates_extracted/templates/* "$TARGET_DIR/"
          rm -rf templates.tpz /tmp/godot_templates_extracted

      - name: Generate complete export_presets.cfg
        run: |
          cat << 'EOF' > export_presets.cfg
          [preset.0]
          name="iOS"
          platform="iOS"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/ios/game.xcodeproj"
          script_export_mode=1

          [preset.0.options]
          architectures/arm64=true
          application/bundle_identifier="com.towerwars.game"
          application/signature="com.towerwars.game"
          application/short_version="1.0"
          application/version="1.0"
          application/team_id="XYZ1234567"
          application/app_store_team_id="XYZ1234567"
          capabilities/access_gyroscope=false
          capabilities/access_accelerometer=false
          capabilities/access_magnetometer=false
          user_data/accessible_from_filesystem=false
          user_data/accessible_via_itunes_sharing=false
          privacy/camera_usage_description=""
          privacy/microphone_usage_description=""
          privacy/photolib_usage_description=""
          EOF

      - name: Export Xcode Project from Godot
        run: |
          mkdir -p build/ios
          godot --headless --export-release "iOS" build/ios/game.xcodeproj

      - name: Build Xcode Project (No Codesign)
        run: |
          cd build/ios
          XCODE_PROJ=$(ls -d *.xcodeproj | head -n 1)
          SCHEME_NAME=$(basename "$XCODE_PROJ" .xcodeproj)
          xcodebuild -project "$XCODE_PROJ" \
            -scheme "$SCHEME_NAME" \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA Structure
        run: |
          cd build/ios
          mkdir -p Payload
          cp -r build/Release-iphoneos/*.app Payload/ 2>/dev/null || cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r TowerWars_Godot_iOS.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TowerWars-Godot-IPA
          path: build/ios/TowerWars_Godot_iOS.ipa
