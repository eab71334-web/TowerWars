name: Build TowerWars iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios-ipa:
    runs-on: macos-latest

    steps:
      # 1. سحب الكود من المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد وتثبيت بيئة Flutter
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 3. إعداد وتنفيذ تهيئة منصة iOS لمشروع Flutter
      - name: Enable and Configure Flutter iOS
        run: |
          flutter config --enable-ios
          flutter create --platforms=ios . --overwrite
          flutter pub get

      # 4. بناء تطبيق iOS وتوليد حزمة Runner.app بدون توقيع (No CodeSign)
      - name: Build Unsigned iOS App
        run: |
          flutter build ios --release --no-codesign

      # 5. تجميع المخرجات في مجلد Payload وضغطه إلى ملف IPA
      - name: Package Unsigned IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          mv Runner.app Payload/
          zip -r TowerWars_Unsigned.ipa Payload

      # 6. رفع ملف IPA كـ Artifact لتنزيله مباشرة من GitHub Actions
      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TowerWars-iOS-IPA
          path: build/ios/iphoneos/TowerWars_Unsigned.ipa
          if-no-files-found: error
