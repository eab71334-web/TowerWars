name: Build Godot 4 iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-godot-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Godot 4 & Export Templates
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_macos.universal.zip
          unzip -q Godot_v4.3-stable_macos.universal.zip
          sudo mv Godot.app /Applications/Godot.app
          
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/4.3.stable/
          wget https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz -d ~/Library/Application\ Support/Godot/export_templates/4.3.stable/
          mv ~/Library/Application\ Support/Godot/export_templates/4.3.stable/templates/* ~/Library/Application\ Support/Godot/export_templates/4.3.stable/

      # 1. إنشاء ملف إعدادات التصدير الخاص بـ iOS
      - name: Create export_presets.cfg
        run: |
          cat << 'EOF' > export_presets.cfg
          [preset.0]

          name="iOS"
          platform="iOS"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/ios/TowerWars.ipa"

          [preset.0.options]

          architectural/arm64=true
          application/app_store_team_id="1234567890"
          application/bundle_identifier="com.towerwars.game"
          application/signature="????"
          application/short_version="1.0"
          application/version="1.0"
          capabilities/access_wifi=false
          capabilities/push_notifications=false
          user_data/custom_directory_name=""
          EOF

      # 2. تصدير مشروع Xcode ومحتويات اللعبة
      - name: Export Godot iOS Project
        run: |
          mkdir -p build/ios
          /Applications/Godot.app/Contents/MacOS/Godot --headless --export-release "iOS" build/ios/TowerWars.xcodeproj

      # 3. تجميع مشروع Xcode لإنشاء ملف Binary حقيقي وشامل
      - name: Build Xcode Project
        run: |
          cd build/ios
          xcodebuild -project TowerWars.xcodeproj \
                     -scheme TowerWars \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     clean build

      # 4. حزم التطبيق داخل مجلد Payload وإنشاء IPA حقيقي
      - name: Package True IPA
        run: |
          mkdir -p build/Payload
          
          # البحث عن تطبيق .app الناتج من عملية Xcode وتضمينه
          BUILD_APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "TowerWars.app" | head -n 1)
          
          if [ -z "$BUILD_APP_PATH" ]; then
            BUILD_APP_PATH=$(find build/ios -type d -name "TowerWars.app" | head -n 1)
          fi

          cp -R "$BUILD_APP_PATH" build/Payload/
          
          cd build
          zip -r TowerWars_Godot.ipa Payload

      # 5. رفع ملف الـ IPA النهائي كـ Artifact
      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TowerWars-Godot-IPA
          path: build/TowerWars_Godot.ipa
          if-no-files-found: error
