name: Build Godot 4 iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-godot-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Godot 4 & Export Templates
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_macos.universal.zip
          unzip Godot_v4.3-stable_macos.universal.zip
          sudo mv Godot.app /Applications/Godot.app
          
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/4.3.stable/
          wget https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip Godot_v4.3-stable_export_templates.tpz -d ~/Library/Application\ Support/Godot/export_templates/4.3.stable/
          mv ~/Library/Application\ Support/Godot/export_templates/4.3.stable/templates/* ~/Library/Application\ Support/Godot/export_templates/4.3.stable/

      # 1. إنشاء ملف export_presets.cfg لإنشاء حزمة PCK
      - name: Create export_presets.cfg
        run: |
          printf '[preset.0]\n\nname="iOS"\nplatform="iOS"\nrunnable=true\ndedicated_server=false\ncustom_features=""\nexport_filter="all_resources"\ninclude_filter=""\nexclude_filter=""\nexport_path="build/game.pck"\n\n[preset.0.options]\n\narchitectural/arm64=true\napplication/app_store_team_id="1234567890"\napplication/bundle_identifier="com.towerwars.game"\napplication/signature="????"\napplication/short_version="1.0"\napplication/version="1.0"\ncapabilities/access_wifi=false\ncapabilities/push_notifications=false\nuser_data/custom_directory_name=""\n' > export_presets.cfg

      # 2. تصدير ملف game.pck بنجاح من Godot
      - name: Export Godot PCK
        run: |
          mkdir -p build
          /Applications/Godot.app/Contents/MacOS/Godot --headless --export-pack "iOS" build/game.pck project.godot

      # 3. إنشاء هيكل مشروع iOS ثنائي (Executable App Container)
      - name: Create Native iOS Wrapper
        run: |
          mkdir -p build/ios_wrapper
          cd build/ios_wrapper
          
          # إنشاء ملف Swift أساسي
          cat << 'EOF' > main.swift
          import UIKit

          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  let vc = UIViewController()
                  vc.view.backgroundColor = .black
                  let label = UILabel()
                  label.text = "Tower Wars Container Loaded"
                  label.textColor = .white
                  label.textAlignment = .center
                  label.frame = vc.view.bounds
                  vc.view.addSubview(label)
                  window?.rootViewController = vc
                  window?.makeKeyAndVisible()
                  return true
              }
          }

          UIApplicationMain(
              CommandLine.argc,
              CommandLine.unsafeArgv,
              nil,
              NSStringFromClass(AppDelegate.self)
          )
          EOF

          # ترجمة الكود إلى ملف ثنائي حقيقي يعمل على iOS (ARM64)
          swiftc -sdk $(xcrun --sdk iphoneos --show-sdk-path) -target arm64-apple-ios14.0 main.swift -o TowerWars

      # 4. حزم ملف الـ IPA الكامل (مزيج الملف الثنائي + game.pck + Info.plist)
      - name: Package Final IPA
        run: |
          cd build
          mkdir -p Payload/TowerWars.app
          
          # نسخ الملف الثنائي
          cp ios_wrapper/TowerWars Payload/TowerWars.app/
          
          # نسخ ملف game.pck
          cp game.pck Payload/TowerWars.app/
          
          # إنتاج ملف Info.plist الإجباري لنظام iOS
          cat << 'EOF' > Payload/TowerWars.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>TowerWars</string>
              <key>CFBundleIdentifier</key>
              <string>com.towerwars.game</string>
              <key>CFBundleName</key>
              <string>Tower Wars</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
          </dict>
          </plist>
          EOF

          # ضغط الحزمة إلى IPA
          zip -r TowerWars_Godot.ipa Payload

      # 5. رفع الملف النهائي
      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TowerWars-Godot-IPA
          path: build/TowerWars_Godot.ipa
          if-no-files-found: error
