name: Build Godot iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Godot Engine
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_macos.universal.zip
          unzip Godot_v4.3-stable_macos.universal.zip
          mv Godot.app /Applications/Godot.app
          
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/4.3.stable/
          wget https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip Godot_v4.3-stable_export_templates.tpz -d ~/Library/Application\ Support/Godot/export_templates/4.3.stable/
          mv ~/Library/Application\ Support/Godot/export_templates/4.3.stable/templates/* ~/Library/Application\ Support/Godot/export_templates/4.3.stable/

      - name: Export Xcode Project from Godot
        run: |
          mkdir -p build/ios
          chmod -R 777 .
          /Applications/Godot.app/Contents/MacOS/Godot --headless --export-release "iOS" build/ios/TowerWars.xcodeproj

      - name: Build Unsigned IPA via xcodebuild
        run: |
          cd build/ios
          xcodebuild -project TowerWars.xcodeproj -scheme TowerWars -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO -configuration Release build
          
          # تجميع المخرجات في مجلد Payload وتحويله لـ IPA
          mkdir -p Payload
          cp -r build/Release-iphoneos/TowerWars.app Payload/
          zip -r TowerWars_Unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TowerWars-Unsigned-IPA
          path: build/ios/TowerWars_Unsigned.ipa
