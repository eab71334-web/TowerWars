name: Build Godot 4 iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-godot-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Godot 4 & Export Templates
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_macos.universal.zip
          unzip Godot_v4.3-stable_macos.universal.zip
          sudo mv Godot.app /Applications/Godot.app
          
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/4.3.stable/
          wget https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip Godot_v4.3-stable_export_templates.tpz -d ~/Library/Application\ Support/Godot/export_templates/4.3.stable/
          mv ~/Library/Application\ Support/Godot/export_templates/4.3.stable/templates/* ~/Library/Application\ Support/Godot/export_templates/4.3.stable/

      # إنشاء ملف إعدادات التصدير بصيغة Xcode Project
      - name: Create export_presets.cfg
        run: |
          printf '[preset.0]\n\nname="iOS"\nplatform="iOS"\nrunnable=true\ndedicated_server=false\ncustom_features=""\nexport_filter="all_resources"\ninclude_filter=""\nexclude_filter=""\nexport_path="build/ios/TowerWars.xcodeproj"\n\n[preset.0.options]\n\narchitectural/arm64=true\napplication/app_store_team_id="1234567890"\napplication/bundle_identifier="com.towerwars.game"\napplication/signature="????"\napplication/short_version="1.0"\napplication/version="1.0"\ncapabilities/access_wifi=false\ncapabilities/push_notifications=false\nuser_data/custom_directory_name=""\n' > export_presets.cfg

      # تصدير مشروع Xcode الكامل من Godot
      - name: Export Godot Project to Xcode
        run: |
          mkdir -p build/ios
          /Applications/Godot.app/Contents/MacOS/Godot --headless --export-release "iOS" build/ios/TowerWars.xcodeproj project.godot || true

      # بناء الملف الثنائي المشفر لـ iOS عبر Xcode
      - name: Build Xcode App (No CodeSign)
        run: |
          cd build/ios
          xcodebuild -project TowerWars.xcodeproj -scheme TowerWars -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO clean build

      # تجميع الملفات داخل حزمة Payload وتوليد الـ IPA
      - name: Package Complete IPA
        run: |
          cd build/ios
          APP_PATH=$(find . -type d -name "*.app" | head -n 1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r TowerWars_Godot.ipa Payload

      # رفع ملف الـ IPA النهائي
      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TowerWars-Godot-IPA
          path: build/ios/TowerWars_Godot.ipa
          if-no-files-found: error
