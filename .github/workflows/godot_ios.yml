name: Build Godot 4 iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-godot-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Godot 4 & Export Templates
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_macos.universal.zip
          unzip -q Godot_v4.3-stable_macos.universal.zip
          sudo mv Godot.app /Applications/Godot.app
          
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/4.3.stable/
          wget https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz -d ~/Library/Application\ Support/Godot/export_templates/4.3.stable/
          mv ~/Library/Application\ Support/Godot/export_templates/4.3.stable/templates/* ~/Library/Application\ Support/Godot/export_templates/4.3.stable/

      # 1. إعداد ملف export_presets متوافق وبدون متطلبات معقدة
      - name: Create export_presets.cfg
        run: |
          cat << 'EOF' > export_presets.cfg
          [preset.0]

          name="iOS"
          platform="iOS"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/ios/TowerWars.xcodeproj"

          [preset.0.options]

          architectural/arm64=true
          application/app_store_team_id="1234567890"
          application/bundle_identifier="com.towerwars.game"
          application/signature="????"
          application/short_version="1.0"
          application/version="1.0"
          capabilities/access_wifi=false
          capabilities/push_notifications=false
          user_data/custom_directory_name=""
          EOF

      # 2. تصدير مشروع Xcode الحقيقي وتوليد ملف البيانات pck
      - name: Export Godot Xcode Project
        run: |
          mkdir -p build/ios
          /Applications/Godot.app/Contents/MacOS/Godot --headless --export-pack "iOS" build/ios/game.pck project.godot
          /Applications/Godot.app/Contents/MacOS/Godot --headless --export-release "iOS" build/ios/TowerWars.zip || true
          
          # فك ضغط المشروع إذا تم تصديره كمفهوم مضغوط
          if [ -f "build/ios/TowerWars.zip" ]; then
            unzip -q build/ios/TowerWars.zip -d build/ios/
          fi

      # 3. تجميع مشروع Xcode المولّد نظيفاً عبر xcodebuild
      - name: Build with Xcode
        run: |
          cd build/ios
          PROJ_FILE=$(find . -name "*.xcodeproj" | head -n 1)
          SCHEME_NAME=$(basename "$PROJ_FILE" .xcodeproj)
          
          xcodebuild build \
            -project "$PROJ_FILE" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR=../build_output

      # 4. تجميع مجلد Payload وإنشاء ملف IPA المكتمل
      - name: Create IPA Structure
        run: |
          mkdir -p build/Payload
          cp -R build/build_output/*.app build/Payload/TowerWars.app
          
          # التأكد من إدراج ملف اللعبة pck داخل حزمة التطبيق
          if [ -f "build/ios/game.pck" ]; then
            cp build/ios/game.pck build/Payload/TowerWars.app/
          fi

          cd build
          zip -r TowerWars_Godot.ipa Payload

      # 5. رفع ملف הـ IPA الناتج كـ Artifact
      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TowerWars-Godot-IPA
          path: build/TowerWars_Godot.ipa
          if-no-files-found: error
