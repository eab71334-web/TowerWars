name: Build Godot 4 iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-godot-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create export_presets.cfg if missing
        run: |
          if [ ! -f export_presets.cfg ]; then
            cat << 'EOF' > export_presets.cfg
          [preset.0]
          name="iOS"
          platform="iOS"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/ios/game.xcodeproj"
          script_export_mode=1

          [preset.0.options]
          architectures/arm64=true
          EOF
          fi

      - name: Godot Export with Templates
        uses: firebelley/godot-export@v6.0.0
        with:
          godot_version: 4.2.2
          godot_executable_download_url: https://downloads.tuxfamily.org/godotengine/4.2.2/Godot_v4.2.2-stable_macos.universal.zip
          godot_export_templates_download_url: https://downloads.tuxfamily.org/godotengine/4.2.2/Godot_v4.2.2-stable_export_templates.tpz"
          relative_project_path: ./
          archive_output: false

      - name: Export Xcode Project manually via Headless Godot
        run: |
          mkdir -p build/ios
          godot --headless --export-release "iOS" build/ios/game.xcodeproj || true

      - name: Build Xcode Project (No Codesign)
        run: |
          cd build/ios
          XCODE_PROJ=$(ls -d *.xcodeproj | head -n 1)
          SCHEME_NAME=$(basename "$XCODE_PROJ" .xcodeproj)
          xcodebuild -project "$XCODE_PROJ" \
            -scheme "$SCHEME_NAME" \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA / TIPA Structure
        run: |
          cd build/ios
          mkdir -p Payload
          cp -r build/Release-iphoneos/*.app Payload/ 2>/dev/null || cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r TowerWars_Godot_iOS.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TowerWars-Godot-IPA
          path: build/ios/TowerWars_Godot_iOS.ipa
