name: Build TowerWars iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable and Configure Flutter iOS
        run: |
          flutter config --enable-ios
          flutter create --platforms=ios . --project-name tower_wars --overwrite
          flutter pub get

      - name: Build Unsigned iOS App
        run: |
          flutter build ios --release --no-codesign

      - name: Package Unsigned IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          mv Runner.app Payload/
          zip -r TowerWars_Unsigned.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TowerWars-iOS-IPA
          path: build/ios/iphoneos/TowerWars_Unsigned.ipa
          if-no-files-found: error
